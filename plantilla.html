<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bitácora de Avances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;900&family=Chivo+Mono:wght@500&display=swap">
<style>
/* Layout: identidad Single — banda azul marino con logo y huella en verde, portafolio en tarjetas; ficha de proyecto con avance, reporte e historial */
:root{
  --navy:#0C1E42; --blue:#264370; --green:#89DD8F; --green-ink:#2f8f45; --white:#ffffff;
  --bg:#f3f6fa; --surface:#ffffff; --ink:#0C1E42; --muted:#5a6a86; --line:#dce3ee;
  --band:#0C1E42; --band-ink:#ffffff;
  --accent:#264370; --on-accent:#ffffff; --cta:#89DD8F; --on-cta:#0C1E42;
  --c1:#264370; --c2:#2f8f45; --c3:#4f7cc4; --c4:#13857c; --c5:#6b5bc2; --c6:#c9771a;
  --ok:#2f8f45; --warn:#c98a00; --bad:#d23c3c; --done:#264370;
  --f-display:"Chivo",system-ui,sans-serif;
  --f-body:"Chivo",system-ui,sans-serif;
  --f-mono:"Chivo Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081530; --surface:#0f2148; --ink:#f2f6fc; --muted:#9fb0cc; --line:#22386a;
  --band:#06102a; --band-ink:#ffffff;
  --accent:#89DD8F; --on-accent:#0C1E42; --cta:#89DD8F; --on-cta:#0C1E42;
  --c1:#7fa3e6; --c2:#89DD8F; --c3:#6fb8ff; --c4:#4fd1c2; --c5:#a99cf2; --c6:#f2a640;
  --ok:#89DD8F; --warn:#f0b93a; --bad:#f07070; --done:#7fa3e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081530; --surface:#0f2148; --ink:#f2f6fc; --muted:#9fb0cc; --line:#22386a;
  --band:#06102a; --band-ink:#ffffff;
  --accent:#89DD8F; --on-accent:#0C1E42; --cta:#89DD8F; --on-cta:#0C1E42;
  --c1:#7fa3e6; --c2:#89DD8F; --c3:#6fb8ff; --c4:#4fd1c2; --c5:#a99cf2; --c6:#f2a640;
  --ok:#89DD8F; --warn:#f0b93a; --bad:#f07070; --done:#7fa3e6; color-scheme:dark}
.band{background:var(--band);color:var(--band-ink);position:relative;overflow:hidden}
.band-in{max-width:1120px;margin:0 auto;padding-block:22px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;position:relative;z-index:1}
.band .logo{display:block;height:34px;width:auto;margin-bottom:22px}
.band h1{color:var(--band-ink)}
.band .eyebrow{color:#89DD8F}
.band .print{position:absolute;right:-30px;top:-40px;width:260px;height:260px;opacity:.9;pointer-events:none}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:#89DD8F}
@media (max-width:640px){.band .print{width:170px;height:170px;right:-50px;top:-30px;opacity:.5}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:900;letter-spacing:-.01em;font-size:clamp(28px,5vw,40px);line-height:1;margin:6px 0 0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0}
h3{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0}
.btn{font:700 14px var(--f-body);border:0;border-radius:10px;padding:10px 16px;background:var(--cta);color:var(--on-cta);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.danger{background:var(--bad);color:#fff}
.link{background:none;border:0;padding:0;font:600 13px var(--f-body);color:var(--accent);cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.alert b{color:var(--bad)}
/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent))}
/* Tarjetas de proyecto */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;border-top:4px solid var(--c);min-width:0}
.pcard:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line));border-top-color:var(--c)}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard .nm{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.pct{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.track.lg{height:16px}
.fill{height:100%;border-radius:99px;background:var(--c)}
.pcard .foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--s) 14%,transparent);color:var(--s);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--s)}
.bcount{color:var(--bad);font-weight:600}
.spark{display:block;width:100%;height:34px}
.empty{color:var(--muted);font-size:14px}
.empty-hero{text-align:center;padding:40px 16px;display:grid;gap:12px;justify-items:center}
.empty-hero .ghostbar{width:min(320px,100%);display:grid;gap:8px}
/* Detalle */
.detail{display:grid;gap:16px}
.d-head{display:grid;gap:14px}
.d-title{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.d-title h2{font-size:clamp(22px,4vw,30px);font-weight:900;overflow-wrap:anywhere}
.d-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);align-items:center}
.d-desc{color:var(--muted);max-width:70ch;margin:0}
.d-progress{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media (max-width:880px){.cols{grid-template-columns:1fr}}
.stack{display:grid;gap:16px;align-content:start}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:440px;height:auto}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.blist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.blist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;font-size:14px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--bad) 8%,transparent)}
.blist li.ok{background:var(--bg);color:var(--muted);text-decoration:line-through}
.blist .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);margin-top:6px}
.blist li.ok .dot{background:var(--ok)}
.when{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-decoration:none}
.nlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.nlist li{display:flex;gap:10px;font-size:14px}
.nlist li::before{content:"";flex:none;width:8px;height:8px;margin-top:7px;border-radius:2px;background:var(--c)}
/* Historial */
.hist{display:grid}
.entry{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0;padding-top:4px}
.entry .date{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.3}
.entry .date b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);font-weight:800}
.entry .row1{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.entry .mini{flex:1 1 140px;max-width:240px}
.entry .v{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.entry .up{color:var(--ok)}
.items{display:grid;gap:6px;font-size:14px}
.items div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px}
.items dt,.items .k{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.items .b{color:var(--bad)}
.items p{margin:0;overflow-wrap:anywhere;white-space:pre-line}
/* Formularios */
form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:640px){.f2{grid-template-columns:1fr}}
label.l{font-size:12px;color:var(--muted);display:grid;gap:5px;font-weight:500}
input[type=text],input[type=date],select,textarea{width:100%;box-sizing:border-box;font:14px var(--f-body);padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:62px}
input[type=range]{width:100%;accent-color:var(--c)}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;align-items:center}
.slider output{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--c);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.f-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.msg{font-size:13px;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--bad) 10%,transparent);font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s ease}}
</style>
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Solo lectura */
#newBtn,#projPanel,#edit,#del,section.panel:has(#upForm){display:none!important}
.ro{display:inline-flex;align-items:center;gap:6px;font:500 12.5px var(--f-body);color:#fff;background:#0C1E42;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 12px}
</style>
</head>

<script>
const COLORS=["--c1","--c2","--c3","--c4","--c5","--c6"];
const ST={tiempo:{n:"En tiempo",c:"--ok"},riesgo:{n:"En riesgo",c:"--warn"},retraso:{n:"Retrasado",c:"--bad"},pausa:{n:"En pausa",c:"--muted"},terminado:{n:"Terminado",c:"--done"}};
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fd=d=>{if(!d)return null;const[y,m,dd]=d.split("-");return{d:+dd,m:MES[+m-1],y}};
const fdl=d=>{const t=fd(d);return t?`${t.d} ${t.m} ${t.y}`:""};
const pad=n=>String(n).padStart(2,"0");
const iso=t=>`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
function lastFriday(){const t=new Date();t.setDate(t.getDate()-((t.getDay()+2)%7));return iso(t)}
const kid=e=>e.id||("f"+e.fecha);
const skey=e=>e.fecha+"|"+(e.ts||"");
const hist=p=>[...(p.historial||[])].sort((a,b)=>skey(b).localeCompare(skey(a)));
const hora=e=>{if(!e.ts)return "";const t=new Date(e.ts);return isNaN(t)?"":pad(t.getHours())+":"+pad(t.getMinutes())};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const latest=p=>hist(p)[0];
const openBlocks=p=>(p.historial||[]).filter(h=>h.bloqueo&&!h.resuelto);

const semaforo=p=>{const v=latest(p)?.pct??0;return v<=25?"--bad":v<75?"--warn":"--ok"};
let projects=[], db=null, canWrite=true, view={id:null}, filter="Todos", editingId=null, pColor="--c1", confirmDel=false, editRep=null, confirmRep=null;

/* ---------- Portafolio ---------- */
const etapa=p=>{const h=latest(p);if(h&&(h.estatus==="terminado"||(h.pct||0)>=100))return "completado";if(h?.estatus==="pausa")return "pausado";return "activo"};
const ETAPAS=[["activo","Activos","--accent"],["completado","Completados","--ok"],["pausado","En pausa","--muted"],["todos","Todos","--ink"]];
let etapaF="activo";
function renderList(){
  const all=projects.filter(p=>!p.archivado);
  const cnt={activo:0,completado:0,pausado:0,todos:all.length};all.forEach(p=>cnt[etapa(p)]++);
  const act=all.filter(p=>etapa(p)==="activo");
  const lts=act.map(latest).filter(Boolean);
  const avg=act.length?Math.round(lts.reduce((s,h)=>s+(h.pct||0),0)/act.length):0;
  const risk=act.filter(p=>["riesgo","retraso"].includes(latest(p)?.estatus)).length;
  const blk=act.reduce((s,p)=>s+openBlocks(p).length,0);
  $("kpis").innerHTML=`<div class="kpi"><b>${cnt.activo}</b><span>Proyectos activos</span></div><div class="kpi"><b>${cnt.completado}</b><span>Proyectos completados</span></div><div class="kpi"><b>${avg}%</b><span>Avance promedio de activos</span></div><div class="kpi ${risk||blk?"alert":""}"><b>${risk}<span style="font-size:15px;color:var(--muted);font-weight:500"> · ${blk} bloqueo${blk===1?"":"s"}</span></b><span>En riesgo o retrasados</span></div>`;
  const pool=all.filter(p=>etapaF==="todos"||etapa(p)===etapaF);
  const frentes=["Todos",...new Set(pool.map(p=>p.frente).filter(Boolean))];
  if(!frentes.includes(filter))filter="Todos";
  $("filters").innerHTML=`<div class="filters" role="group" aria-label="Estado">${ETAPAS.map(([k,n,c])=>`<button type="button" class="chip" style="--c:var(${c})" data-e="${k}" aria-pressed="${k===etapaF}">${n} <span style="opacity:.7">${cnt[k]}</span></button>`).join("")}</div>${frentes.length>2?`<span style="width:1px;background:var(--line);margin:0 6px" aria-hidden="true"></span><div class="filters" role="group" aria-label="Frente">${frentes.map(f=>`<button type="button" class="chip" data-f="${esc(f)}" aria-pressed="${f===filter}">${esc(f)}</button>`).join("")}</div>`:""}`;
  const shown=pool.filter(p=>filter==="Todos"||p.frente===filter).sort((a,b)=>(latest(b)?.fecha||b.creado||"").localeCompare(latest(a)?.fecha||a.creado||""));
  if(!all.length){
    $("grid").innerHTML=`<div class="panel empty-hero" style="grid-column:1/-1"><div class="ghostbar"><div class="track"><div class="fill" style="--c:var(--line);width:60%"></div></div><div class="track"><div class="fill" style="--c:var(--line);width:35%"></div></div></div><h2>Crea tu primer proyecto</h2><p class="empty" style="margin:0;max-width:46ch">Cada proyecto tendrá su barra de avance, estatus, bloqueos, comentarios y un historial de reportes.</p><button class="btn" type="button" onclick="openProj()">+ Nuevo proyecto</button></div>`;
    return;
  }
  const vacio={activo:"No hay proyectos activos.",completado:"Aún no hay proyectos completados. Un proyecto pasa aquí cuando llega a 100% o lo marcas como Terminado.",pausado:"No hay proyectos en pausa. Marca el estatus En pausa en un reporte para moverlo aquí.",todos:"No hay proyectos."}[etapaF];
  $("grid").innerHTML=shown.map(p=>{const h=latest(p);const st=ST[h?.estatus];const b=openBlocks(p).length;const e=etapa(p);
    const cc=e==="completado"?"--ok":e==="pausado"?"--muted":semaforo(p);
    return `<button type="button" class="pcard" style="--c:var(${cc})${e==="pausado"?";opacity:.85":""}" data-id="${p.id}">
      <div class="top"><div style="min-width:0"><div class="tag">${esc(p.frente||"Sin frente")}${e==="completado"?" · ✓ Completado":e==="pausado"?" · En pausa":""}</div><div class="nm">${esc(p.nombre)}</div></div><div class="pct">${h?.pct??0}%</div></div>
      <div class="track"><div class="fill" style="width:${h?.pct??0}%"></div></div>
      ${spark(p)}
      <div class="foot">${st?`<span class="pill" style="--s:var(${st.c})">${st.n}</span>`:`<span>Sin avances aún</span>`}<span>${b?`<span class="bcount">${b} bloqueo${b>1?"s":""}</span> · `:""}${h?fdl(h.fecha):"Creado "+fdl(p.creado)}</span></div>
    </button>`}).join("")||`<p class="empty" style="grid-column:1/-1">${filter==="Todos"?vacio:"No hay proyectos de este frente en esta vista."}</p>`;
}
function spark(p){const d=hist(p).reverse().slice(-10);
  if(d.length<2)return `<svg class="spark" viewBox="0 0 200 34" aria-hidden="true"><line x1="0" x2="200" y1="30" y2="30" stroke="var(--line)" stroke-dasharray="3 4"/></svg>`;
  const x=i=>4+i*192/(d.length-1),y=v=>30-v*0.26;const pts=d.map((h,i)=>`${x(i)},${y(h.pct||0)}`);
  return `<svg class="spark" viewBox="0 0 200 34" aria-hidden="true"><path d="M${x(0)},30 L${pts.join(" L")} L${x(d.length-1)},30Z" fill="var(--c)" fill-opacity=".1"/><polyline points="${pts.join(" ")}" fill="none" stroke="var(--c)" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(d.length-1)}" cy="${y(d[d.length-1].pct||0)}" r="3.5" fill="var(--c)"/></svg>`}
$("filters").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;if(b.dataset.e){etapaF=b.dataset.e;filter="Todos"}else filter=b.dataset.f;renderList()};
$("grid").onclick=e=>{const c=e.target.closest(".pcard");if(c)openDetail(c.dataset.id)};

/* ---------- Detalle ---------- */
const fState={pct:0,estatus:"tiempo"};
function openDetail(id){view.id=id;confirmDel=false;editRep=null;confirmRep=null;$("listView").hidden=true;$("projPanel").hidden=true;$("detailView").hidden=false;renderDetail(true);window.scrollTo({top:0})}
function backToList(){view.id=null;$("detailView").hidden=true;$("listView").hidden=false;renderList()}
function renderDetail(resetForm){
  const p=projects.find(x=>x.id===view.id);
  if(!p){backToList();return}
  const H=hist(p), h=H[0], st=ST[h?.estatus], blocks=(p.historial||[]).filter(x=>x.bloqueo).sort((a,b)=>(a.resuelto?1:0)-(b.resuelto?1:0)||skey(b).localeCompare(skey(a)));
  const draft=resetForm?null:readForm();
  if(resetForm){fState.pct=h?.pct??0;fState.estatus=h?.estatus||"tiempo"}
  $("detailView").style.setProperty("--c",`var(${etapa(p)==="completado"?"--ok":etapa(p)==="pausado"?"--muted":semaforo(p)})`);
  $("detailView").innerHTML=`
  <div><button class="link" type="button" id="back">← Todos los proyectos</button></div>
  <section class="panel d-head">
    <div class="d-title"><div style="min-width:0"><div class="tag">${esc(p.frente||"Sin frente")}</div><h2>${esc(p.nombre)}</h2></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" type="button" id="edit">Editar</button><button class="btn ghost sm" type="button" id="del">Eliminar</button></div></div>
    ${confirmDel?`<div class="confirm">¿Eliminar “${esc(p.nombre)}” y todo su historial? No se puede deshacer. <button class="btn danger sm" type="button" id="delYes">Sí, eliminar</button><button class="btn ghost sm" type="button" id="delNo">Cancelar</button></div>`:""}
    ${p.descripcion?`<p class="d-desc">${esc(p.descripcion)}</p>`:""}
    <div class="d-progress"><div class="track lg"><div class="fill" style="width:${h?.pct??0}%"></div></div><div class="pct" style="font-size:34px">${h?.pct??0}%</div></div>
    <div class="d-meta">${st?`<span class="pill" style="--s:var(${st.c})">${st.n}</span>`:"<span>Sin avances registrados</span>"}${p.meta?`<span>Meta: <b style="color:var(--ink)">${fdl(p.meta)}</b></span>`:""}${p.responsable?`<span>Responsable: <b style="color:var(--ink)">${esc(p.responsable)}</b></span>`:""}${h?`<span>Último reporte: ${fdl(h.fecha)}</span>`:""}</div>
  </section>

  <div class="cols">
    <div class="stack">
      <section class="panel">
        <div class="panel-head"><h2>${editRep?"Editar reporte":"Nuevo reporte"}</h2>${editRep?`<button class="link" type="button" id="cancelEdit">Cancelar edición</button>`:`<span class="msg">Cada reporte se agrega al historial; puedes hacer varios el mismo día.</span>`}</div>
        <form id="upForm">
          <div class="f2"><label class="l">Fecha<input type="date" id="uFecha" required></label>
          <div class="l">Avance total<div class="slider"><input type="range" id="uPct" min="0" max="100" step="5" aria-label="Porcentaje de avance"><output id="uPctO"></output></div></div></div>
          <div class="l">Estatus<div class="chips" id="uSt">${Object.entries(ST).map(([k,s])=>`<button type="button" class="chip" style="--c:var(${s.c})" data-s="${k}" aria-pressed="false">${s.n}</button>`).join("")}</div></div>
          <label class="l">Logros de la semana<textarea id="uLogro" maxlength="400" placeholder="Qué quedó terminado o qué se decidió"></textarea></label>
          <label class="l">Comentarios<textarea id="uCom" maxlength="400" placeholder="Contexto, acuerdos, observaciones"></textarea></label>
          <div class="f2"><label class="l">Bloqueo<textarea id="uBloq" maxlength="200" placeholder="Qué te detiene y quién lo destraba"></textarea></label>
          <label class="l">Próxima semana<textarea id="uProx" maxlength="300" placeholder="Compromisos para el siguiente viernes"></textarea></label></div>
          <div class="f-foot"><span class="msg" id="uMsg">${canWrite?"":"Esta vista es de solo lectura."}</span><button class="btn" type="submit">${editRep?"Guardar cambios":"Agregar reporte"}</button></div>
        </form>
      </section>
      <section class="panel"><div class="panel-head"><h2>Historial</h2><span class="msg">${H.length} reporte${H.length===1?"":"s"}</span></div>
        <div class="hist">${H.length?H.map((e,i)=>{const prev=H[i+1];const d=prev?(e.pct||0)-(prev.pct||0):null;const s=ST[e.estatus];const t=fd(e.fecha);const k=kid(e);
          return `<article class="entry"><div class="date"><b>${t.d}</b>${t.m} ${t.y}${hora(e)?`<br>${hora(e)} h`:""}</div><div style="min-width:0">
            <div class="row1"><div class="mini"><div class="track"><div class="fill" style="width:${e.pct||0}%"></div></div></div><span class="v">${e.pct||0}%</span>${d!==null&&d!==0?`<span class="v ${d>0?"up":""}">${d>0?"+":""}${d}</span>`:""}${s?`<span class="pill" style="--s:var(${s.c})">${s.n}</span>`:""}${canWrite?`<span style="margin-left:auto;display:flex;gap:12px"><button class="link" type="button" data-load="${k}">Editar</button><button class="link" type="button" data-delrep="${k}" style="color:var(--bad)">Borrar</button></span>`:""}</div>
            ${confirmRep===k?`<div class="confirm" style="margin-bottom:8px">¿Borrar este reporte? No se puede deshacer. <button class="btn danger sm" type="button" data-delyes="${k}">Sí, borrar</button><button class="btn ghost sm" type="button" data-delno="1">Cancelar</button></div>`:""}
            <div class="items">${e.logro?`<div><span class="k">Logros</span><p>${esc(e.logro)}</p></div>`:""}${e.comentario?`<div><span class="k">Comentarios</span><p>${esc(e.comentario)}${canWrite?` <button class="link" type="button" data-delcom="${k}" style="color:var(--bad);font-size:12px;margin-left:6px">Borrar comentario</button>`:""}</p></div>`:""}${e.bloqueo?`<div><span class="k">Bloqueo</span><p class="${e.resuelto?"":"b"}">${esc(e.bloqueo)}${e.resuelto?" (resuelto)":""}</p></div>`:""}${e.proxima?`<div><span class="k">Siguiente</span><p>${esc(e.proxima)}</p></div>`:""}</div>
          </div></article>`}).join(""):`<p class="empty">Aún no hay reportes de este proyecto.</p>`}</div>
      </section>
    </div>
    <div class="stack">
      <section class="panel"><div class="panel-head"><h2>Curva de avance</h2></div><div class="chart">${curve(p)}</div></section>
      <section class="panel"><div class="panel-head"><h2>Bloqueos</h2><span class="msg">${blocks.filter(b=>!b.resuelto).length} abiertos</span></div>
        ${blocks.length?`<ul class="blist">${blocks.map(b=>`<li class="${b.resuelto?"ok":""}"><span class="dot"></span><span style="min-width:0;overflow-wrap:anywhere">${esc(b.bloqueo)}<br><span class="when">${fdl(b.fecha)}</span></span>${canWrite?`<button class="btn ghost sm" type="button" data-res="${kid(b)}">${b.resuelto?"Reabrir":"Resuelto"}</button>`:""}</li>`).join("")}</ul>`:`<p class="empty">Sin bloqueos registrados.</p>`}
      </section>
      <section class="panel"><div class="panel-head"><h2>Próximos pasos</h2></div>
        ${h?.proxima?`<ul class="nlist">${h.proxima.split(/\n+/).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="empty">Sin próximos pasos registrados.</p>`}
      </section>
    </div>
  </div>`;
  // form state
  if(resetForm){editRep=null;confirmRep=null}
  if(draft&&!resetForm)fillForm(draft);else fillForm(editRep?(p.historial||[]).find(x=>kid(x)===editRep):null);
  bindDetail(p);
}
function curve(p){
  const d=hist(p).reverse().slice(-16);
  const W=440,H=200,L=38,R=12,T=12,B=28,n=d.length;
  const x=i=>n<2?L+(W-L-R)/2:L+i*(W-L-R)/(n-1),y=v=>T+(H-T-B)*(1-v/100);
  let g="";[0,25,50,75,100].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end">${v}%</text>`});
  if(!n)return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sin datos">${g}<text x="${(W+L)/2}" y="${H/2-4}" text-anchor="middle">Se dibuja con el primer reporte</text></svg>`;
  const step=Math.ceil(n/6);d.forEach((e,i)=>{if(i%step===0||i===n-1){const t=fd(e.fecha);g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${t.d} ${t.m}</text>`}});
  const pts=d.map((e,i)=>[x(i),y(e.pct||0)]);
  if(n>1)g+=`<path d="M${pts[0][0]},${y(0)} L${pts.map(p=>p.join(",")).join(" L")} L${pts[n-1][0]},${y(0)}Z" fill="var(--c)" fill-opacity=".1"/><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--c)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{const last=i===n-1;g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${last?5:3}" fill="${last?"var(--c)":"var(--surface)"}" stroke="var(--c)" stroke-width="2"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de avance">${g}</svg>`;
}
function readForm(){if(!$("uFecha"))return null;return{_draft:true,fecha:$("uFecha").value,pct:fState.pct,estatus:fState.estatus,logro:$("uLogro").value,comentario:$("uCom").value,bloqueo:$("uBloq").value,proxima:$("uProx").value}}
function fillForm(e){
  $("uFecha").value=e?.fecha||iso(new Date());
  if(e){fState.pct=e.pct??0;fState.estatus=e.estatus||"tiempo"}
  $("uPct").value=fState.pct;$("uPctO").textContent=fState.pct+"%";
  ["uLogro","uCom","uBloq","uProx"].forEach((id,i)=>$(id).value=e?.[["logro","comentario","bloqueo","proxima"][i]]||"");
  $("uSt").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.s===fState.estatus));
}
function bindDetail(p){
  $("back").onclick=backToList;
  $("edit").onclick=()=>openProj(p);
  $("del").onclick=()=>{confirmDel=true;renderDetail(false)};
  if($("delNo"))$("delNo").onclick=()=>{confirmDel=false;renderDetail(false)};
  if($("delYes"))$("delYes").onclick=async()=>{try{await db.collection("proyectos").doc(p.id).delete();backToList()}catch(e){confirmDel=false;renderDetail(false);$("uMsg").textContent=errMsg(e)}};
  $("uPct").oninput=e=>{fState.pct=+e.target.value;$("uPctO").textContent=fState.pct+"%"};
  $("uSt").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;fState.estatus=b.dataset.s;$("uSt").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b))};
  const all=()=>(p.historial||[]).map(x=>({...x}));
  if($("cancelEdit"))$("cancelEdit").onclick=()=>renderDetail(true);
  $("detailView").querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{editRep=b.dataset.load;confirmRep=null;renderDetail(false);fillForm((p.historial||[]).find(x=>kid(x)===editRep));$("upForm").scrollIntoView({behavior:"smooth",block:"start"})});
  $("detailView").querySelectorAll("[data-delrep]").forEach(b=>b.onclick=()=>{confirmRep=b.dataset.delrep;renderDetail(false)});
  $("detailView").querySelectorAll("[data-delno]").forEach(b=>b.onclick=()=>{confirmRep=null;renderDetail(false)});
  $("detailView").querySelectorAll("[data-delyes]").forEach(b=>b.onclick=async()=>{const k=b.dataset.delyes;confirmRep=null;if(editRep===k)editRep=null;
    await save(p,{historial:all().filter(x=>kid(x)!==k)});});
  $("detailView").querySelectorAll("[data-delcom]").forEach(b=>b.onclick=async()=>{const k=b.dataset.delcom;
    await save(p,{historial:all().map(x=>kid(x)===k?{...x,comentario:""}:x)});});
  $("detailView").querySelectorAll("[data-res]").forEach(b=>b.onclick=async()=>{
    await save(p,{historial:all().map(e=>kid(e)===b.dataset.res?{...e,resuelto:!e.resuelto}:e)});});
  $("upForm").onsubmit=async e=>{e.preventDefault();
    const f=readForm();if(!f.fecha)return;
    const fields={fecha:f.fecha,pct:f.pct,estatus:f.estatus,logro:f.logro.trim(),comentario:f.comentario.trim(),bloqueo:f.bloqueo.trim(),proxima:f.proxima.trim()};
    let h;
    if(editRep){h=all().map(x=>{if(kid(x)!==editRep)return x;const n={...x,...fields,id:kid(x)};if(x.bloqueo!==n.bloqueo)delete n.resuelto;return n})}
    else{h=all();h.push({id:newId(),ts:new Date().toISOString(),...fields})}
    $("uMsg").textContent="Guardando…";
    if(await save(p,{historial:h}))renderDetail(true);
  };
}
function errMsg(e){return e?.code==="invalid_argument"?"No tienes permiso para guardar en esta bitácora.":e?.code==="quota_exceeded"?"Se llenó el espacio de datos. Elimina proyectos que ya no uses.":"No se pudo guardar. Intenta de nuevo en un momento."}
async function save(p,changes){
  if(!db){if($("uMsg"))$("uMsg").textContent="Guardar no está disponible en esta vista.";return false}
  const {id,...body}=p;
  try{await db.collection("proyectos").doc(id).set({...body,...changes});return true}
  catch(e){if(e?.code==="invalid_argument")canWrite=false;if($("uMsg"))$("uMsg").textContent=errMsg(e);return false}
}

/* ---------- Crear / editar proyecto ---------- */
function openProj(p){
  editingId=p?.id||null;pColor=p?.color||COLORS[projects.length%COLORS.length];
  $("projTitle").textContent=p?"Editar proyecto":"Nuevo proyecto";$("pSave").textContent=p?"Guardar cambios":"Crear proyecto";
  $("pNombre").value=p?.nombre||"";$("pFrente").value=p?.frente||"";$("pMeta").value=p?.meta||"";$("pResp").value=p?.responsable||"";$("pDesc").value=p?.descripcion||"";
  $("pMsg").textContent=db?"":"Guardar no está disponible en esta vista.";
  drawSwatches();$("projPanel").hidden=false;$("projPanel").scrollIntoView({behavior:"smooth",block:"start"});$("pNombre").focus({preventScroll:true});
}
function drawSwatches(){if(!$("swatches"))return;$("swatches").innerHTML=COLORS.map(c=>`<button type="button" class="sw" style="--c:var(${c})" data-c="${c}" aria-label="Color ${c.slice(3)}" aria-pressed="${c===pColor}"></button>`).join("")}
if($("swatches"))$("swatches").onclick=e=>{const b=e.target.closest(".sw");if(!b)return;pColor=b.dataset.c;drawSwatches()};
$("newBtn").onclick=()=>openProj(null);
$("pCancel").onclick=()=>{$("projPanel").hidden=true};
$("projForm").onsubmit=async e=>{e.preventDefault();
  if(!db){$("pMsg").textContent="No se pudo guardar: esta vista no tiene acceso a los datos.";return}
  const data={nombre:$("pNombre").value.trim(),frente:$("pFrente").value.trim(),meta:$("pMeta").value,responsable:$("pResp").value.trim(),descripcion:$("pDesc").value.trim(),color:pColor};
  if(!data.nombre)return;
  $("pMsg").textContent="Guardando…";
  try{
    if(editingId){const p=projects.find(x=>x.id===editingId);const{id,...body}=p;await db.collection("proyectos").doc(editingId).set({...body,...data})}
    else{const ref=db.collection("proyectos").doc();await ref.set({...data,creado:iso(new Date()),historial:[]});view.id=ref.id}
    $("projPanel").hidden=true;$("pMsg").textContent="";
    if(view.id)openDetail(view.id);
  }catch(err){$("pMsg").textContent=errMsg(err)}
};

renderList();
